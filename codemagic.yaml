# Codemagic: inajenga APK ya PesaFlow SMS kwenye cloud.
# Mashine ya macOS M2 ndiyo yenye dakika 500 za bure kwa mwezi kwa account binafsi.
workflows:
  android-apk:
    name: PesaFlow SMS (APK)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
      groups:
        - pesaflow_signing   # PF_KEYSTORE_B64, PF_KEYSTORE_PASSWORD (siri, ziko Codemagic tu)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Weka anwani ya Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Andaa ufunguo wa kutia sahihi
        script: |
          if [ -n "$PF_KEYSTORE_B64" ]; then
            echo "$PF_KEYSTORE_B64" | base64 --decode > "$CM_BUILD_DIR/pesaflow.jks"
            echo "PF_KEYSTORE_PATH=$CM_BUILD_DIR/pesaflow.jks" >> "$CM_ENV"
            echo "Ufunguo wa kudumu umewekwa."
          else
            echo "ONYO: PF_KEYSTORE_B64 haipo; APK itatiwa sahihi kwa ufunguo wa muda."
          fi
      - name: Jenga APK
        script: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PesaFlow-SMS.apk
    artifacts:
      - app/build/outputs/apk/debug/PesaFlow-SMS.apk
